name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Fetch the pinned OCPI spec
        run: make spec-checkout
      - name: Generated files match their sources
        run: make check OCPI_SPEC_DIR=.spec
      - name: Python and Kotlin conformance tests
        run: make test OCPI_SPEC_DIR=.spec
