[project]
name = "ev-pnc-ocpi-model"
version = "0.1.0"
description = "Generated Python types for the EV_PNC canonical OCPI 2.3.0-shaped model and domain events"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.21", "referencing>=0.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ev_pnc_ocpi_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
